[app]
language=en

[golemio]
dataSource=golemio
apiKey=INSERT_GOLEMIO_API_KEY_HERE
address=http://api.golemio.cz/v2/pid/departureboards/
parameters="&minutesAfter=180&includeMetroTrains=true&mode=departures&order=real&filter=routeOnce&skip=canceled"

[deviceManagementService]
